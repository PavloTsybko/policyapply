name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: policyapply_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d policyapply_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POLICYAPPLY_TEST_DATABASE_URL: postgresql://postgres:synthetic_ci_only_password@127.0.0.1:5432/policyapply_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: sh quickstart/init.sh
      - run: docker compose -f compose.quickstart.yml config --quiet
      - run: docker compose -f compose.quickstart.yml up --build --detach --wait --wait-timeout 180
      - run: sh quickstart/smoke.sh
      - if: failure()
        run: docker compose -f compose.quickstart.yml logs --no-color
      - if: always()
        run: docker compose -f compose.quickstart.yml down --volumes --remove-orphans
